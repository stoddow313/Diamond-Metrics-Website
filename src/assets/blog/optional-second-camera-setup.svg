<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Primary and optional side camera positions for a baseball game</title>
  <desc id="desc">A text-free baseball field diagram. A blue camera sits behind home plate as the primary view. A gold camera sits near the first base line as the optional side view.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b1f43"/><stop offset="1" stop-color="#07152e"/></linearGradient>
    <radialGradient id="grass" cx="50%" cy="45%" r="65%"><stop stop-color="#50ad71"/><stop offset="1" stop-color="#1f704d"/></radialGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d8a26b"/><stop offset="1" stop-color="#b96e42"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#night)"/>
  <!-- outfield, foul lines, and infield -->
  <path d="M600 625 L185 210 A587 587 0 0 1 1015 210 Z" fill="url(#grass)" filter="url(#shadow)"/>
  <path d="M600 625 L325 350 A389 389 0 0 1 875 350 Z" fill="none" stroke="#f7eddc" stroke-opacity=".88" stroke-width="5"/>
  <path d="M600 625 L325 350 M600 625 L875 350" fill="none" stroke="#f7eddc" stroke-width="4" stroke-linecap="round"/>
  <path d="M325 350 A389 389 0 0 1 875 350" fill="none" stroke="#f7eddc" stroke-opacity=".88" stroke-width="5"/>
  <path d="M600 625 L405 430 L600 235 L795 430 Z" fill="url(#dirt)" stroke="#f0c38e" stroke-width="2"/>
  <path d="M600 625 L405 430 M600 625 L795 430" fill="none" stroke="#f8f0e2" stroke-opacity=".72" stroke-width="3"/>
  <!-- bases and mound -->
  <rect x="394" y="419" width="22" height="22" rx="2" fill="#fffdf5" stroke="#d7efff" stroke-width="2" transform="rotate(45 405 430)"/>
  <rect x="589" y="224" width="22" height="22" rx="2" fill="#fffdf5" stroke="#d7efff" stroke-width="2" transform="rotate(45 600 235)"/>
  <rect x="784" y="419" width="22" height="22" rx="2" fill="#fffdf5" stroke="#d7efff" stroke-width="2" transform="rotate(45 795 430)"/>
  <path d="M600 601 l17 17 -17 17 -17-17z" fill="#fffdf5" stroke="#d7efff" stroke-width="2"/>
  <circle cx="600" cy="430" r="43" fill="#c78552" stroke="#efc797" stroke-width="3"/>
  <rect x="589" y="420" width="22" height="20" rx="3" fill="#fffdf5" transform="rotate(45 600 430)"/>
  <!-- pitcher, hitter, catcher -->
  <circle cx="600" cy="416" r="13" fill="#14345d" stroke="#f8fafc" stroke-width="3"/>
  <circle cx="570" cy="594" r="13" fill="#14345d" stroke="#f8fafc" stroke-width="3"/>
  <circle cx="600" cy="632" r="13" fill="#14345d" stroke="#f8fafc" stroke-width="3"/>
  <path d="M576 585 l20 10" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <!-- blue primary camera view behind home -->
  <path d="M600 692 L442 496 Q600 425 758 496 Z" fill="#7dd3fc" fill-opacity=".16" stroke="#9bdcff" stroke-width="2" stroke-dasharray="8 8"/>
  <g transform="translate(558 670)"><rect width="84" height="29" rx="8" fill="#102b54" stroke="#7dd3fc" stroke-width="2"/><rect x="28" y="7" width="28" height="15" rx="3" fill="none" stroke="#f8fafc" stroke-width="2.5"/><circle cx="42" cy="14.5" r="4" fill="#f8fafc"/><path d="M42 29v18m-18 0h36m-10-18 8 18m-16-18-8 18" stroke="#7dd3fc" stroke-width="2.5"/></g>
  <circle cx="550" cy="677" r="14" fill="#7dd3fc"/><text x="546" y="683" fill="#07152e" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800">1</text>
  <!-- gold optional first-base-side view -->
  <path d="M1032 540 L703 512 Q711 595 786 622 Z" fill="#f6c76e" fill-opacity=".16" stroke="#f6c76e" stroke-width="2" stroke-dasharray="8 8"/>
  <g transform="translate(1030 526)"><rect width="84" height="29" rx="8" fill="#102b54" stroke="#f6c76e" stroke-width="2"/><rect x="28" y="7" width="28" height="15" rx="3" fill="none" stroke="#fff5db" stroke-width="2.5"/><circle cx="42" cy="14.5" r="4" fill="#fff5db"/><path d="M42 29v18m-18 0h36m-10-18 8 18m-16-18-8 18" stroke="#f6c76e" stroke-width="2.5"/></g>
  <circle cx="1022" cy="533" r="14" fill="#f6c76e"/><text x="1018" y="539" fill="#07152e" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800">2</text>
</svg>
