<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Behind-home-plate camera setup for filming a baseball game</title>
  <desc id="desc">A complete baseball field diagram with a camera positioned outside the backstop, a hitter and catcher at home plate, a pitcher on the mound, all bases, and outfield context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a38"/><stop offset="1" stop-color="#0d2b54"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#287a5c"/><stop offset="1" stop-color="#14533e"/></linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cb8d59"/><stop offset="1" stop-color="#a9653e"/></linearGradient>
    <style>.k{font-family:Arial,Helvetica,sans-serif}.eyebrow{fill:#7dd3fc;font-size:13px;font-weight:800;letter-spacing:1.6px}.h{fill:#f8fafc;font-size:36px;font-weight:800}.p{fill:#cbd5e1;font-size:17px}.label{fill:#dbeafe;font-size:16px;font-weight:700}.small{fill:#93c5fd;font-size:14px}.chip{fill:#0b2348;stroke:#38bdf8;stroke-opacity:.65;stroke-width:1.5}.line{stroke:#7dd3fc;stroke-width:2;fill:none}.base{fill:#f8fafc;stroke:#7dd3fc;stroke-width:2}.player{fill:#071a38;stroke:#f8fafc;stroke-width:3}.number{fill:#071a38;font-size:14px;font-weight:800}</style>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <text x="60" y="70" class="k eyebrow">PRIMARY GAME CAMERA</text>
  <text x="60" y="113" class="k h">Film the whole battery from behind home.</text>
  <text x="60" y="144" class="k p">A wide, stable view preserves the plate, mound, infield, and game context.</text>

  <!-- full field -->
  <path d="M710 603 L434 327 A390 390 0 0 1 986 327 Z" fill="url(#grass)" stroke="#74c69d" stroke-width="3"/>
  <path d="M710 603 L510 403 L710 203 L910 403 Z" fill="#bb7a4f" fill-opacity=".48" stroke="#e7b385" stroke-width="2"/>
  <path d="M434 327 A390 390 0 0 1 986 327" fill="none" stroke="#f8fafc" stroke-opacity=".72" stroke-width="4"/>
  <path d="M710 603 L434 327 M710 603 L986 327" fill="none" stroke="#f8fafc" stroke-opacity=".52" stroke-width="3"/>
  <path d="M510 403 L910 403" fill="none" stroke="#f8fafc" stroke-opacity=".24" stroke-width="2"/>

  <!-- bases and mound -->
  <rect x="500" y="393" width="20" height="20" rx="2" class="base" transform="rotate(45 510 403)"/>
  <rect x="700" y="193" width="20" height="20" rx="2" class="base" transform="rotate(45 710 203)"/>
  <rect x="900" y="393" width="20" height="20" rx="2" class="base" transform="rotate(45 910 403)"/>
  <path d="M710 583 l14 14 -14 14 -14-14z" class="base"/>
  <circle cx="710" cy="403" r="43" fill="url(#dirt)" stroke="#efc08e" stroke-width="2"/>
  <rect x="699" y="393" width="22" height="20" rx="3" fill="#f8fafc" transform="rotate(45 710 403)"/>

  <!-- players correctly positioned at plate and mound -->
  <circle cx="710" cy="389" r="13" class="player"/><text x="732" y="394" class="k small">Pitcher</text>
  <circle cx="681" cy="563" r="13" class="player"/><text x="625" y="555" class="k small">Hitter</text>
  <circle cx="710" cy="606" r="13" class="player"/><text x="733" y="612" class="k small">Catcher</text>
  <text x="722" y="586" class="k small">Home plate</text>
  <text x="478" y="382" class="k small">3B</text><text x="692" y="180" class="k small">2B</text><text x="922" y="382" class="k small">1B</text>
  <text x="666" y="280" class="k small" fill="#dbeafe">Outfield context</text>

  <!-- camera and field-of-view -->
  <path d="M710 678 L565 491 Q710 432 855 491 Z" fill="#38bdf8" fill-opacity=".12" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="8 8"/>
  <g transform="translate(650 650)"><rect width="120" height="42" rx="12" fill="#0b2348" stroke="#38bdf8" stroke-width="2"/><rect x="43" y="10" width="34" height="21" rx="4" fill="none" stroke="#e0f2fe" stroke-width="3"/><circle cx="60" cy="20.5" r="5" fill="#e0f2fe"/><path d="M60 42v18m-25 0h50m-16-18 10 18m-20-18-10 18" stroke="#7dd3fc" stroke-width="3"/></g>
  <text x="674" y="714" class="k small">Camera outside backstop</text>

  <!-- concise callouts -->
  <path d="M566 492 H248 V447" class="line"/>
  <rect x="60" y="374" width="250" height="104" rx="16" class="chip"/>
  <circle cx="86" cy="402" r="14" fill="#7dd3fc"/><text x="81" y="407" class="k number">1</text>
  <text x="110" y="407" class="k label">Mount behind the backstop</text>
  <text x="84" y="436" class="k small">Use a tripod or secure fence mount.</text>
  <text x="84" y="459" class="k small">Keep it level and stationary.</text>
  <path d="M855 492 H1032 V435" class="line"/>
  <rect x="913" y="362" width="227" height="104" rx="16" class="chip"/>
  <circle cx="939" cy="390" r="14" fill="#7dd3fc"/><text x="934" y="395" class="k number">2</text>
  <text x="963" y="395" class="k label">Frame wide enough</text>
  <text x="937" y="424" class="k small">Plate, mound, and infield</text>
  <text x="937" y="447" class="k small">should stay in the same view.</text>
  <text x="60" y="690" class="k small">1080p / 60 fps is a strong full-game baseline. Test battery, storage, and heat before first pitch.</text>
</svg>
