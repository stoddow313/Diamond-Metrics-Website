<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Film a baseball game from behind home plate</title>
  <desc id="desc">A coaching-style full baseball field diagram showing a camera behind home plate, hitter and catcher at the plate, pitcher on the mound, bases, and outfield.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b1f43"/><stop offset="1" stop-color="#07152e"/></linearGradient>
    <radialGradient id="grass" cx="50%" cy="45%" r="65%"><stop stop-color="#4eaa6e"/><stop offset="1" stop-color="#1f704d"/></radialGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d8a26b"/><stop offset="1" stop-color="#b96e42"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter>
    <style>.k{font-family:Arial,Helvetica,sans-serif}.eyebrow{fill:#7dd3fc;font-size:14px;font-weight:800;letter-spacing:2px}.title{fill:#f8fafc;font-size:34px;font-weight:800}.hint{fill:#cbd5e1;font-size:17px}.fieldline{stroke:#f7eddc;stroke-width:4;fill:none;stroke-linecap:round}.label{fill:#f8fafc;font-size:15px;font-weight:700}.sub{fill:#93c5fd;font-size:14px}.leader{stroke:#9bdcff;stroke-width:2;fill:none;stroke-linecap:round}.player{fill:#14345d;stroke:#f8fafc;stroke-width:3}.base{fill:#fffdf5;stroke:#d7efff;stroke-width:2}</style>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#night)"/>
  <text x="64" y="62" class="k eyebrow">PRIMARY GAME CAMERA</text>
  <text x="64" y="104" class="k title">Start behind home plate.</text>
  <text x="64" y="135" class="k hint">A steady, wide view keeps the action connected.</text>

  <!-- full baseball field -->
  <path d="M600 626 L234 260 A518 518 0 0 1 966 260 Z" fill="url(#grass)" filter="url(#shadow)"/>
  <path d="M600 626 L355 381 A346 346 0 0 1 845 381 Z" fill="none" stroke="#f7eddc" stroke-opacity=".84" stroke-width="5"/>
  <path d="M600 626 L355 381 M600 626 L845 381" class="fieldline"/>
  <path d="M355 381 A346 346 0 0 1 845 381" class="fieldline"/>
  <path d="M600 626 L425 451 L600 276 L775 451 Z" fill="url(#dirt)" stroke="#f0c38e" stroke-width="2"/>
  <path d="M600 626 L425 451 M600 626 L775 451" fill="none" stroke="#f8f0e2" stroke-opacity=".7" stroke-width="3"/>

  <!-- bases: 3B, 2B, 1B, home -->
  <rect x="414" y="440" width="22" height="22" rx="2" class="base" transform="rotate(45 425 451)"/>
  <rect x="589" y="265" width="22" height="22" rx="2" class="base" transform="rotate(45 600 276)"/>
  <rect x="764" y="440" width="22" height="22" rx="2" class="base" transform="rotate(45 775 451)"/>
  <path d="M600 602 l17 17 -17 17 -17-17z" class="base"/>

  <!-- mound and players -->
  <circle cx="600" cy="451" r="43" fill="#c78552" stroke="#efc797" stroke-width="3"/>
  <rect x="589" y="441" width="22" height="20" rx="3" fill="#fffdf5" transform="rotate(45 600 451)"/>
  <circle cx="600" cy="437" r="13" class="player"/>
  <circle cx="570" cy="595" r="13" class="player"/>
  <circle cx="600" cy="632" r="13" class="player"/>
  <path d="M576 586 l20 10" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>

  <!-- player labels with leaders -->
  <path d="M612 432 H660" class="leader"/><text x="668" y="438" class="k label">Pitcher</text>
  <path d="M558 590 H506" class="leader"/><text x="440" y="596" class="k label">Hitter</text>
  <path d="M612 632 H650" class="leader"/><text x="658" y="649" class="k label">Catcher</text>
  <path d="M610 614 H662" class="leader"/><text x="670" y="610" class="k label">Home plate</text>

  <!-- camera position and intended frame -->
  <path d="M600 692 L451 505 Q600 445 749 505 Z" fill="#7dd3fc" fill-opacity=".16" stroke="#9bdcff" stroke-width="2" stroke-dasharray="8 8"/>
  <g transform="translate(558 670)"><rect width="84" height="29" rx="8" fill="#102b54" stroke="#7dd3fc" stroke-width="2"/><rect x="28" y="7" width="28" height="15" rx="3" fill="none" stroke="#f8fafc" stroke-width="2.5"/><circle cx="42" cy="14.5" r="4" fill="#f8fafc"/><path d="M42 29v18m-18 0h36m-10-18 8 18m-16-18-8 18" stroke="#7dd3fc" stroke-width="2.5"/></g>

  <text x="600" y="240" text-anchor="middle" class="k sub">Frame the plate, mound, and infield together.</text>
</svg>
