<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Primary baseball game camera setup behind home plate</title>
  <desc id="desc">A diagram showing a stable camera behind home plate with the pitcher, hitter, catcher, and home plate in frame.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a38"/><stop offset="1" stop-color="#0d2b54"/></linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1f6f54"/><stop offset="1" stop-color="#155640"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.k{font-family:Arial,Helvetica,sans-serif}.label{fill:#dbeafe;font-size:19px;font-weight:700}.sub{fill:#93c5fd;font-size:15px}.tiny{fill:#93c5fd;font-size:13px;font-weight:700;letter-spacing:1.5px}.line{stroke:#7dd3fc;stroke-width:2;fill:none}.chip{fill:#0b2348;stroke:#38bdf8;stroke-opacity:.6;stroke-width:1.5}.player{fill:#f8fafc;stroke:#38bdf8;stroke-width:3}.dot{fill:#7dd3fc;filter:url(#glow)}</style>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <text x="70" y="76" class="k tiny">PRIMARY GAME SETUP</text>
  <text x="70" y="125" class="k" fill="#f8fafc" font-size="38" font-weight="800">Film from behind home plate.</text>
  <text x="70" y="158" class="k" fill="#cbd5e1" font-size="19">Keep the pitcher, hitter, catcher, and plate in a stable, wide frame.</text>
  <path d="M600 596 L365 361 L600 126 L835 361 Z" fill="url(#field)" stroke="#69b99b" stroke-width="3"/>
  <path d="M600 596 L600 126 M365 361 H835" stroke="#9fd6bd" stroke-opacity=".4" stroke-width="2"/>
  <circle cx="600" cy="361" r="42" fill="#b87b49" stroke="#e9b281" stroke-width="2"/>
  <rect x="589" y="351" width="22" height="20" rx="3" fill="#f8fafc" transform="rotate(45 600 361)"/>
  <path d="M600 565 l17 17 -17 17 -17-17z" fill="#f8fafc"/>
  <circle cx="600" cy="489" r="12" class="player"/><text x="620" y="495" class="k sub">Catcher</text>
  <circle cx="568" cy="459" r="12" class="player"/><text x="461" y="455" class="k sub">Hitter</text>
  <circle cx="600" cy="347" r="12" class="player"/><text x="621" y="342" class="k sub">Pitcher</text>
  <path d="M600 624 L495 517 A150 150 0 0 1 705 517 Z" fill="#38bdf8" fill-opacity=".15" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="8 8"/>
  <g transform="translate(540 625)"><rect x="0" y="0" width="120" height="50" rx="12" fill="#0b2348" stroke="#38bdf8" stroke-width="2"/><rect x="42" y="12" width="36" height="23" rx="4" fill="none" stroke="#e0f2fe" stroke-width="3"/><circle cx="60" cy="23.5" r="6" fill="#e0f2fe"/><path d="M60 50 v22 m-30 0h60 m-18-22 12 22m-24-22-12 22" stroke="#7dd3fc" stroke-width="3"/></g>
  <circle cx="600" cy="642" r="6" class="dot"/>
  <path d="M670 649 H868 V586" class="line"/>
  <rect x="868" y="530" width="265" height="112" rx="16" class="chip"/>
  <text x="892" y="570" class="k label">Stable camera + tripod</text>
  <text x="892" y="600" class="k sub">Behind the backstop, not handheld.</text>
  <text x="892" y="623" class="k sub">A wide frame is better than tight zoom.</text>
  <path d="M430 278 H240 V214" class="line"/>
  <rect x="70" y="164" width="265" height="104" rx="16" class="chip"/>
  <text x="94" y="204" class="k label">Recommended baseline</text>
  <text x="94" y="235" class="k sub">1080p / 60 fps for full-game video</text>
  <text x="94" y="258" class="k sub">Test battery, storage, and heat first.</text>
  <text x="70" y="675" class="k" fill="#93c5fd" font-size="15">This view supports game context, pitch sequence, contact events, and many timing observations.</text>
</svg>
