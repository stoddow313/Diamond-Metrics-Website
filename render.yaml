# Render Blueprint for the Diamond Metrics API.
# The web frontend stays on Vercel and proxies /api/* here (see vercel.json).
services:
  - type: web
    name: diamond-metrics-api
    runtime: node
    plan: starter # persistent disk (SQLite) requires a paid instance type
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DM_DB_PATH
        value: /var/data/diamond-metrics.db
      - key: DM_ADMIN_PASSWORD
        sync: false # set in the Render dashboard; seeds the admin login on first boot
      # Media storage (Cloudflare R2). Until these are set the API refuses
      # footage uploads — the local fallback shares this service's 1 GB disk
      # with the database. Values are set in the dashboard, never committed.
      - key: DM_STORAGE
        sync: false # set to "r2" in the dashboard together with the four R2_* values
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Signs short-TTL playback URLs; without it links break on every restart.
      - key: DM_MEDIA_SECRET
        generateValue: true
      # ffmpeg/ffprobe ship as static per-platform npm dependencies and are
      # resolved automatically — do NOT set FFMPEG_PATH/FFPROBE_PATH here.
      # An override is only honoured if it is an absolute path that exists.
      # ── Field Live (M7) ──────────────────────────────────────────────
      # Off until deliberately turned on: unset, /api/live/* is simply not
      # mounted and the relay gets 404s.
      - key: DM_LIVE_ENABLED
        sync: false # set to "1" in the dashboard when the relay is up
      # Shared secret proving a caller is the relay. Must match DM_RELAY_TOKEN
      # in /etc/field-live.env on the Hetzner box, in BOTH places it appears.
      # Unset, every relay call is refused — it fails closed on purpose.
      - key: DM_RELAY_TOKEN
        sync: false
      # Signs short-TTL viewer tokens. Generated, because a value that changes
      # on restart would only break links, never leak.
      - key: DM_LIVE_SECRET
        generateValue: true
      # Where the phone publishes. DNS-only in Cloudflare: SRT is UDP and
      # cannot traverse the proxy.
      - key: DM_RELAY_HOST
        value: ingest.diamondmetrics.ai
      # Where viewers watch. Proxied, so segments cache at the edge.
      - key: DM_PLAYBACK_BASE
        value: https://live.diamondmetrics.ai
      # "authenticated" requires a signed-in session for a playback URL;
      # "public" hands one to anyone with the stream id. Team scoping against
      # per-job consent is not built yet.
      - key: DM_LIVE_PLAYBACK_ACCESS
        value: authenticated

      - key: DM_ENV
        value: production
    disk:
      name: diamond-metrics-data
      mountPath: /var/data
      sizeGB: 1
